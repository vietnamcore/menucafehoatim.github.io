<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Menu Quán Cà Phê</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #8B4513;
      color: white;
      padding: 20px;
      font-size: 24px;
    }
    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin: 10px;
      width: 200px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .item img {
      width: 100%;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .item h3 {
      margin: 10px 0 5px 0;
    }
    .item p {
      margin: 0 0 10px 0;
      color: #555;
    }
  </style>
</head>
<body>
  <header>☕ Menu Quán Cà Phê Hoa Tím</header>

  <div class="menu">
    <div class="item">
      <img src="https://i.imgur.com/1zGQZ9j.jpeg" alt="Cà phê sữa đá">
      <h3>Cà phê sữa đá</h3>
      <p>20.000đ</p>
    </div>

    <div class="item">
      <img src="https://i.imgur.com/7Q0xw7J.jpeg" alt="Cà phê đen">
      <h3>Cà phê đen</h3>
      <p>15.000đ</p>
    </div>

    <div class="item">
      <img src="https://i.imgur.com/eN6RZJc.jpeg" alt="Cacao sữa">
      <h3>Cacao sữa</h3>
      <p>28.000đ</p>
    </div>
  </div>
</body>
</html>
